# Zeabur 部署配置
# https://zeabur.com

[project]
name = "ai-prompt-generator"
stage = "production"

[services]

# 后端 API 服务
[services.backend]
name = "api"
package = "backend"
# 构建命令
build_command = "npm install && npm run prisma:generate && npm run build"
# 启动命令
start_command = "npm start"
# 环境变量
[services.backend.env]
NODE_ENV = "production"
PORT = "3001"
DATABASE_URL = "file:./prod.db"
# 在 Zeabur 控制台设置 JWT_SECRET 和 ENCRYPTION_SECRET_KEY
JWT_SECRET = { source = "secret", name = "JWT_SECRET" }
ENCRYPTION_SECRET_KEY = { source = "secret", name = "ENCRYPTION_SECRET_KEY" }
CORS_ORIGIN = "*"

# 前端应用
[services.frontend]
name = "frontend"
package = "frontend"
# 构建命令
build_command = "npm install && npm run build"
# 输出目录
dist_dir = "dist"
# 环境变量（前端）
[services.frontend.env]
# 等后端部署完成后，将这里的 URL 替换为你实际的后端 URL
VITE_API_URL = "https://api.zeabur.app"
