edition: 3.0.0
name: ai-prompt-generator
access: "default"

services:
  backend:
    component: fc3
    props:
      region: cn-hangzhou
      functionName: ai-prompt-generator-api
      description: AI Prompt Generator Backend API
      runtime: nodejs18
      code: ./backend
      handler: index.handler
      memorySize: 512
      timeout: 30
      cpu: 0.5
      diskSize: 512
      environmentVariables:
        NODE_ENV: production
        PORT: "3001"
        DATABASE_URL: "file:./prod.db"
        JWT_SECRET: "${JWT_SECRET}"
        ENCRYPTION_SECRET_KEY: "${ENCRYPTION_SECRET_KEY}"
        CORS_ORIGIN: "${CORS_ORIGIN}"
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          description: HTTP Trigger
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS

  frontend:
    component: oss
    props:
      region: cn-hangzhou
      bucket: ai-prompt-generator-frontend
      src:
        codeUri: ./frontend/dist
        prefix: ''
        exclude:
          - .git
      website:
        index: index.html
        error: index.html
