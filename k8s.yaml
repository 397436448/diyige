apiVersion: v1
kind: Namespace
metadata:
  name: ai-prompt-generator

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-prompt-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: node:18-alpine
          command: ["/bin/sh"]
          args: ["-c", "cd /app && npm install && npm run build && npm run prisma:generate && npm start"]
          workingDir: /app
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              value: "file:./prod.db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
            - name: ENCRYPTION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: encryption-secret-key
            - name: CORS_ORIGIN
              value: "*"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ai-prompt-generator
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
  type: LoadBalancer

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ai-prompt-generator
type: Opaque
stringData:
  jwt-secret: "your-super-secret-jwt-key-change-this"
  encryption-secret-key: "your-super-secret-encryption-key-change-this"
